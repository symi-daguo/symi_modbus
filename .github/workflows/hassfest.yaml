name: Hassfest

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Hassfest validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hassfest
        # The manifest plugin validates custom integrations against the core
        # manifest schema, which rejects the keys HACS needs ("homeassistant",
        # "icon" and "categories"). The other plugins still check the
        # manifest, the services and the translations.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}://github/workspace" \
            ghcr.io/home-assistant/hassfest \
            --action validate \
            --skip-plugins manifest
