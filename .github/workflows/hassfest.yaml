name: Hassfest

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Hassfest validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hassfest
        # The manifest now follows the core schema, so every plugin runs. A
        # skipped plugin would hide a key that Home Assistant rejects.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}://github/workspace" \
            ghcr.io/home-assistant/hassfest \
            --action validate
