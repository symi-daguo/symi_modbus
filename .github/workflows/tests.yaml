name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: Run tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Home Assistant and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "homeassistant==2026.10.2" pytest pytest-asyncio pyserial

      - name: Run pytest
        run: python -m pytest tests/ -q --asyncio-mode=auto
