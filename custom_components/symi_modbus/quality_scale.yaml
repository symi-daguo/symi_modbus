# Quality scale rules of the Symi Modbus integration.
# See https://developers.home-assistant.io/docs/core/integration-quality-scale/rules
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: >-
      The scan interval is the period of one round over all slaves of a master
      and defaults to one second, the slaves of a master share it. The relay
      modules change state on a command, so the state is read often.
  brands: done
  common-modules:
    status: exempt
    comment: >-
      The integration has no coordinator, the hub polls the slaves itself and
      the switch entities share one base class.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: The integration subscribes to nothing, it polls the device.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: >-
      The write_coil action reports a failure in the log, it does not raise an
      exception to the caller.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The integration has no credentials, the connection is a serial port.
  test-coverage: done
