write_coil:
  name: Write Coil
  description: Write a coil value to a Modbus device.
  fields:
    address:
      name: Address
      description: Coil address (required).
      required: true
      example: 0
      selector:
        number:
          min: 0
          mode: box
    slave:
      name: Slave
      description: Slave unit ID (required).
      required: true
      example: 10
      selector:
        number:
          min: 0
          mode: box
    state:
      name: State
      description: Value to write (boolean or list of booleans).
      required: true
      example: true
      selector:
        boolean:
    hub:
      name: Hub
      description: Integration entry title shown in Settings (same as the hub name, e.g. Modbus TCP 0A). Optional; default is a legacy placeholder and may not match your entry.
      example: Modbus TCP 0A
      selector:
        text:

write_register:
  name: Write Register
  description: Write register is not implemented for this device profile.
  fields:
    address:
      name: Address
      description: Register address (required).
      required: true
      example: 0
      selector:
        number:
          min: 0
          mode: box
    slave:
      name: Slave
      description: Slave unit ID (required).
      required: true
      example: 10
      selector:
        number:
          min: 0
          mode: box
    value:
      name: Value
      description: Value to write (integer or list of integers).
      required: true
      example: 1
      selector:
        number:
          min: 0
          mode: box
    hub:
      name: Hub
      description: Integration entry title (same as hub name).
      example: Modbus TCP 0A
      selector:
        text:
